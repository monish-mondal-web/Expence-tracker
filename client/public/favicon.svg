<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background / Coin Gradients -->
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cashGreen1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cashGreen2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="pocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="pocketRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- 1. Background Cash Notes peeking out from the pocket -->
  <!-- Left Note (angled -12 deg) -->
  <g transform="rotate(-12 24 24)">
    <rect x="14" y="6" width="26" height="22" rx="3" fill="url(#cashGreen1)" />
    <!-- Note inner border -->
    <rect x="16" y="8" width="22" height="18" rx="2" fill="none" stroke="#A7F3D0" stroke-width="1" stroke-dasharray="2 1" opacity="0.8" />
    <!-- Note center circle -->
    <circle cx="27" cy="17" r="4" fill="#A7F3D0" opacity="0.4" />
    <path d="M25.5 15h3m-3 1.5h3m-1.8-1.5v4.5" stroke="#047857" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Right Note (angled +10 deg) -->
  <g transform="rotate(10 38 22)">
    <rect x="24" y="8" width="26" height="22" rx="3" fill="url(#cashGreen2)" />
    <!-- Note inner border -->
    <rect x="26" y="10" width="22" height="18" rx="2" fill="none" stroke="#D1FAE5" stroke-width="1" stroke-dasharray="2 1" opacity="0.9" />
    <!-- Note center circle -->
    <circle cx="37" cy="19" r="4" fill="#D1FAE5" opacity="0.5" />
    <path d="M35.5 17h3m-3 1.5h3m-1.8-1.5v4.5" stroke="#065F46" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- 2. Shiny Gold Coin in front of notes -->
  <g>
    <!-- Coin shadow -->
    <circle cx="43" cy="25" r="9" fill="rgba(0,0,0,0.15)" />
    <!-- Outer coin -->
    <circle cx="42" cy="24" r="9" fill="url(#goldCoin)" stroke="#B45309" stroke-width="1" />
    <!-- Inner coin ring -->
    <circle cx="42" cy="24" r="7" fill="none" stroke="#FEF08A" stroke-width="0.8" stroke-dasharray="1.5 1.5" />
    <!-- Rupee symbol on coin -->
    <text x="42" y="27.5" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#78350F" text-anchor="middle">₹</text>
  </g>

  <!-- 3. The Tailored Pocket Body -->
  <path d="M 10 24
           Q 32 27 54 24
           L 51 46
           Q 49 52 44 56
           L 32 61
           L 20 56
           Q 15 52 13 46
           Z"
        fill="url(#pocketBody)" />

  <!-- Pocket Rim / Top Hem -->
  <path d="M 10 24
           Q 32 27 54 24
           L 53.5 28.5
           Q 32 31 10.5 28.5
           Z"
        fill="url(#pocketRim)" />

  <!-- Realistic Stitched Hem Dashes -->
  <path d="M 12.5 30
           Q 32 32.5 51.5 30"
        fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="2.5 2" opacity="0.75" />

  <path d="M 15 45
           Q 16.5 50 21 53.5
           L 32 58
           L 43 53.5
           Q 47.5 50 49 45"
        fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="2.5 2" opacity="0.85" />

  <!-- Center Pocket Rivet with Mini Khorcha Sparkle -->
  <circle cx="32" cy="40" r="3" fill="#F59E0B" />
  <circle cx="32" cy="40" r="1.5" fill="#FEF08A" />
</svg>